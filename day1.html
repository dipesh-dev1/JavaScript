<!DOCTYPE html>
<html>

            <h3>Object Example</h3>
            <p id="objectDemo"></p>

            let student = {name:"Dipesh", age:20, course:"B.Tech in IT"};
            document.getElementById("objectDemo").innerHTML = `Name: ${student.name},
            Age: ${student.age}`;
        </script>
        </body>
    </head>
</html>
